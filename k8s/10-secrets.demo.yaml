# ---------------------------------------------------------------------------
#  DEMO ONLY - these are NOT real secrets.
#  They are committed so that the project deploys in one command on minikube.
#  For a real deployment, create them out of band instead, for example:
#    kubectl -n talus create secret generic api-session \
#      --from-literal=SESSION_SECRET="$(openssl rand -hex 32)"
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: talus
  labels:
    part-of: talus
# The basic-auth type requires the "username" and "password" keys.
type: kubernetes.io/basic-auth
stringData:
  username: talus
  password: demo-only-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: api-session
  namespace: talus
  labels:
    part-of: talus
type: Opaque
stringData:
  # Signs the players' session cookies (HS256). DEMO ONLY value.
  SESSION_SECRET: demo-only-session-secret-change-me
